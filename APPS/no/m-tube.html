<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M TUBE — Created by MUHAMMAD TAQI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface-hover: #272727;
      --text: #f1f1f1; --text-secondary: #aaaaaa; --accent: #ff0000;
      --border: #303030; --radius: 12px; --radius-sm: 8px;
      --header-height: 56px; --nav-height: 56px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden; }

    /* HEADER */
    #header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
      background: var(--bg); display: flex; align-items: center; padding: 0 12px;
      gap: 8px; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { display: flex; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; }
    .logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold; color: #fff; }
    .logo-text { font-size: 18px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
    .logo-text span { color: var(--accent); }
    .search-container { flex: 1; display: flex; align-items: center;
      background: var(--surface); border-radius: 20px; padding: 0 12px;
      height: 40px; max-width: 600px; border: 1px solid transparent; }
    .search-container:focus-within { border-color: var(--accent); }
    .search-container input { flex: 1; background: transparent; border: none;
      outline: none; color: var(--text); font-size: 15px; padding: 0 8px; }
    .search-container input::placeholder { color: var(--text-secondary); }
    .search-btn { background: transparent; border: none; color: var(--text-secondary);
      cursor: pointer; padding: 4px; }
    .search-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* MAIN */
    #main { position: fixed; top: var(--header-height); bottom: var(--nav-height);
      left: 0; right: 0; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; }

    /* FEED */
    .feed-grid { display: flex; flex-direction: column; gap: 16px; padding: 12px; }
    .video-card { background: var(--surface); border-radius: var(--radius);
      overflow: hidden; cursor: pointer; }
    .video-card:active { background: var(--surface-hover); }
    .thumbnail-wrap { position: relative; width: 100%; aspect-ratio: 16/9;
      background: #1a1a1a; overflow: hidden; }
    .thumbnail-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration-badge { position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.8); color: #fff; font-size: 12px;
      padding: 2px 6px; border-radius: 4px; }
    .video-info { padding: 12px; display: flex; gap: 12px; }
    .channel-avatar { width: 36px; height: 36px; border-radius: 50%;
      background: var(--border); flex-shrink: 0; overflow: hidden; }
    .channel-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .video-meta { flex: 1; min-width: 0; }
    .video-title { font-size: 15px; font-weight: 500; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 4px; }
    .video-channel { font-size: 13px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video-stats { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* SHARE BAR */
    .share-bar { display: flex; align-items: center; padding: 0 12px 12px; gap: 8px; }
    .share-btn { display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface-hover); color: var(--text); border: none;
      border-radius: 18px; padding: 8px 14px; font-size: 13px;
      font-weight: 500; cursor: pointer; }
    .share-btn:active { background: var(--border); }
    .share-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* SHORTS */
    .section-title { font-size: 18px; font-weight: 700; padding: 16px 12px 8px;
      display: flex; align-items: center; gap: 8px; }
    .section-title .shorts-icon { color: var(--accent); }
    .shorts-shelf { display: flex; gap: 12px; padding: 0 12px 16px;
      overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; }
    .shorts-shelf::-webkit-scrollbar { display: none; }
    .short-card { flex: 0 0 auto; width: 140px; scroll-snap-align: start;
      border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
    .short-thumb { position: relative; width: 100%; aspect-ratio: 9/16;
      background: #1a1a1a; overflow: hidden; }
    .short-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .short-thumb .short-duration { position: absolute; bottom: 6px; left: 6px;
      background: rgba(0,0,0,0.8); color: #fff; font-size: 10px;
      padding: 1px 4px; border-radius: 3px; }
    .short-info { padding: 8px; }
    .short-title { font-size: 12px; font-weight: 500; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; }
    .short-channel { font-size: 11px; color: var(--text-secondary); margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* BOTTOM NAV */
    #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-height); background: var(--surface);
      border-top: 1px solid var(--border); display: flex;
      align-items: center; justify-content: space-around; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; color: var(--text-secondary);
      font-size: 10px; cursor: pointer; padding: 6px 16px; }
    .nav-item.active { color: var(--text); }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

    /* PLAYER OVERLAY */
    #player-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000; z-index: 200; display: none; flex-direction: column; }
    #player-overlay.active { display: flex; }
    .player-header { display: flex; align-items: center; padding: 8px 12px;
      gap: 12px; background: #000; min-height: 48px; }
    .player-back { background: none; border: none; color: #fff; cursor: pointer;
      padding: 4px; }
    .player-back svg { width: 24px; height: 24px; fill: currentColor; }
    .player-title { flex: 1; font-size: 15px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .player-share-btn { background: none; border: none; color: #fff;
      cursor: pointer; padding: 4px; }
    .player-share-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .player-video-wrap { width: 100%; aspect-ratio: 16/9; background: #000;
      position: relative; }
    .player-video-wrap iframe { width: 100%; height: 100%; border: none; }
    .player-video-wrap.vertical { aspect-ratio: 9/16; max-height: 70vh;
      display: flex; align-items: center; justify-content: center; }
    .player-video-wrap.vertical iframe { width: auto; height: 100%; max-width: 100%; }
    .player-info { padding: 16px; overflow-y: auto; flex: 1;
      -webkit-overflow-scrolling: touch; }
    .player-info-title { font-size: 16px; font-weight: 600; line-height: 1.4;
      margin-bottom: 8px; color: #fff; }
    .player-info-channel { font-size: 14px; color: var(--text-secondary);
      margin-bottom: 12px; }
    .player-share-row { display: flex; gap: 12px; margin-top: 12px;
      padding-top: 12px; border-top: 1px solid var(--border); }

    /* LOADING / ERROR */
    .loading { display: flex; align-items: center; justify-content: center;
      padding: 40px 20px; color: var(--text-secondary); font-size: 14px; gap: 10px; }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { text-align: center; padding: 40px 20px;
      color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
    .error-msg button { margin-top: 12px; background: var(--accent); color: #fff;
      border: none; padding: 10px 24px; border-radius: 20px;
      font-size: 14px; font-weight: 500; cursor: pointer; }

    /* EMPTY */
    .empty-state { text-align: center; padding: 60px 20px;
      color: var(--text-secondary); }
    .empty-state svg { width: 64px; height: 64px; fill: var(--border);
      margin-bottom: 16px; }
    .empty-state p { font-size: 15px; line-height: 1.5; }

    /* SEARCH RESULTS HEADER */
    .search-results-header { padding: 12px 12px 4px; font-size: 13px;
      color: var(--text-secondary); }

    /* TOAST */
    #toast { position: fixed; bottom: calc(var(--nav-height) + 16px);
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: #333; color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; opacity: 0;
      transition: opacity 0.3s, transform 0.3s; pointer-events: none;
      z-index: 300; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* RESPONSIVE */
    @media (min-width: 600px) {
      .feed-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .short-card { width: 160px; }
    }
    @media (min-width: 900px) {
      .feed-grid { grid-template-columns: repeat(3, 1fr); }
      .short-card { width: 180px; }
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="logo" onclick="goHome()">
      <div class="logo-icon">M</div>
      <div class="logo-text">TUBE<span>.</span></div>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search YouTube..." autocomplete="off" enterkeyhint="search">
      <button class="search-btn" onclick="performSearch()" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </header>

  <main id="main"><div id="content"></div></main>

  <nav id="bottom-nav">
    <button class="nav-item active" onclick="goHome()" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="goShorts()" data-tab="shorts">
      <svg viewBox="0 0 24 24"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25.03.01 1.2.5 1.2.5L6 14.93c-1.83.97-2.53 3.24-1.56 5.07.97 1.83 3.24 2.53 5.07 1.56l8.5-4.5c1.29-.68 2.06-2.04 1.99-3.49-.07-1.42-.94-2.68-2.23-3.25zm-.23 5.86-8.5 4.5c-1.34.71-3.01.2-3.72-1.14-.71-1.34-.2-3.01 1.14-3.72l2.04-1.08v-1.21l-.69-.28-1.11-.46c-.99-.41-1.65-1.35-1.7-2.41-.05-1.06.52-2.06 1.46-2.56l8.5-4.5c1.34-.71 3.01-.2 3.72 1.14.71 1.34.2 3.01-1.14 3.72l-2.04 1.08v1.21l.69.28 1.11.46c.99.41 1.65 1.35 1.7 2.41.05 1.06-.52 2.06-1.46 2.56z"/></svg>
      <span>Shorts</span>
    </button>
    <button class="nav-item" onclick="goSearch()" data-tab="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Search</span>
    </button>
  </nav>

  <div id="player-overlay">
    <div class="player-header">
      <button class="player-back" onclick="closePlayer()" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="player-title" id="playerTitle"></div>
      <button class="player-share-btn" onclick="shareCurrentVideo()" aria-label="Share">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
      </button>
    </div>
    <div class="player-video-wrap" id="playerVideoWrap"></div>
    <div class="player-info" id="playerInfo"></div>
  </div>

  <div id="toast"></div>

  <script>
    /* ============================================================
       M TUBE — Created by MUHAMMAD TAQI
       ============================================================ */

    /* ---------- STATE ---------- */
    let currentTab = 'home';
    let currentVideoId = null;
    let searchQuery = '';
    let isLoading = false;

    /* ---------- DOM REFS ---------- */
    const $content = document.getElementById('content');
    const $searchInput = document.getElementById('searchInput');
    const $playerOverlay = document.getElementById('player-overlay');
    const $playerTitle = document.getElementById('playerTitle');
    const $playerVideoWrap = document.getElementById('playerVideoWrap');
    const $playerInfo = document.getElementById('playerInfo');
    const $toast = document.getElementById('toast');

    /* ---------- UTILITY: Format helpers ---------- */
    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      return `${m}:${String(s).padStart(2,'0')}`;
    }

    function formatViews(views) {
      if (!views && views !== 0) return '';
      if (views >= 1000000) return (views/1000000).toFixed(1) + 'M views';
      if (views >= 1000) return (views/1000).toFixed(1) + 'K views';
      return views + ' views';
    }

    function formatPublished(timestamp) {
      if (!timestamp) return '';
      const now = Math.floor(Date.now()/1000);
      const diff = now - timestamp;
      if (diff < 3600) return Math.floor(diff/60) + 'm ago';
      if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
      if (diff < 2592000) return Math.floor(diff/86400) + 'd ago';
      if (diff < 31536000) return Math.floor(diff/2592000) + 'mo ago';
      return Math.floor(diff/31536000) + 'y ago';
    }

    function showToast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      setTimeout(() => $toast.classList.remove('show'), 2000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* ---------- UTILITY: Share ---------- */
    async function shareVideo(videoId, title) {
      const url = `https://www.youtube.com/watch?v=${videoId}`;
      try {
        if (navigator.share) {
          await navigator.share({ title: title || 'M TUBE Video', url });
        } else {
          await navigator.clipboard.writeText(url);
          showToast('Link copied to clipboard');
        }
      } catch (e) {
        try {
          await navigator.clipboard.writeText(url);
          showToast('Link copied');
        } catch (e2) { showToast('Could not share'); }
      }
    }

    function shareCurrentVideo() {
      if (currentVideoId) shareVideo(currentVideoId, $playerTitle.textContent);
    }

    /* ---------- FETCH oEmbed METADATA ---------- */
    async function fetchOEmbed(videoId) {
      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
        if (!res.ok) throw new Error('oEmbed failed');
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    /* ---------- HOME FEED (Curated static list + oEmbed metadata) ---------- */
    /* Kyunki koi free API nahi bacha, hum ek curated list use karenge.
       Aap apni pasand ke video IDs yahan daal sakte hain. */
    const CURATED_VIDEOS = [
      { id: 'dQw4w9WgXcQ', isShort: false },
      { id: '9bZkp7q19f0', isShort: false },
      { id: 'kJQP7kiw5Fk', isShort: false },
      { id: 'JGwWNGJdvx8', isShort: false },
      { id: 'RgKAFK5djSk', isShort: false },
      { id: 'OPf0YbXqDm0', isShort: false },
      { id: 'fJ9rUzIMcZQ', isShort: false },
      { id: 'hT_nvWreIhg', isShort: false },
      { id: 'YQHsXMglC9A', isShort: false },
      { id: 'CevxZvSJLk8', isShort: false },
      { id: '60ItHLz5WEA', isShort: false },
      { id: 'PT2_F-1esPk', isShort: false },
      { id: 'pRpeEdMmmQ0', isShort: true },
      { id: 'kXYiU_JCYtU', isShort: true },
      { id: 'e-ORhEE9VVg', isShort: true },
      { id: 'nfWlot6h_JM', isShort: true },
      { id: 'YykjpeuMNEk', isShort: true },
      { id: '3AtDnEC4zak', isShort: true },
    ];

    async function loadHome() {
      if (isLoading) return;
      isLoading = true;
      currentTab = 'home';
      setActiveNav('home');
      $content.innerHTML = `<div class="loading"><div class="spinner"></div>Loading...</div>`;

      try {
        // Fetch oEmbed metadata for all curated videos (parallel, but limited)
        const videos = await Promise.all(
          CURATED_VIDEOS.map(async (v) => {
            const meta = await fetchOEmbed(v.id);
            return {
              id: v.id,
              title: meta?.title || 'YouTube Video',
              thumbnail: meta?.thumbnail_url || `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`,
              channel: meta?.author_name || 'YouTube',
              channelAvatar: '', // oEmbed avatar nahi deta
              duration: 0, // oEmbed duration nahi deta
              views: 0,
              published: null,
              isShort: v.isShort
            };
          })
        );

        const shorts = videos.filter(v => v.isShort);
        const regular = videos.filter(v => !v.isShort);

        let html = '';

        // Shorts shelf
        if (shorts.length > 0) {
          html += `
            <div class="section-title">
              <svg class="shorts-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25.03.01 1.2.5 1.2.5L6 14.93c-1.83.97-2.53 3.24-1.56 5.07.97 1.83 3.24 2.53 5.07 1.56l8.5-4.5c1.29-.68 2.06-2.04 1.99-3.49-.07-1.42-.94-2.68-2.23-3.25zm-.23 5.86-8.5 4.5c-1.34.71-3.01.2-3.72-1.14-.71-1.34-.2-3.01 1.14-3.72l2.04-1.08v-1.21l-.69-.28-1.11-.46c-.99-.41-1.65-1.35-1.7-2.41-.05-1.06.52-2.06 1.46-2.56l8.5-4.5c1.34-.71 3.01-.2 3.72 1.14.71 1.34.2 3.01-1.14 3.72l-2.04 1.08v1.21l.69.28 1.11.46c.99.41 1.65 1.35 1.7 2.41.05 1.06-.52 2.06-1.46 2.56z"/></svg>
              Shorts
            </div>
            <div class="shorts-shelf">
              ${shorts.map(v => `
                <div class="short-card" onclick="openVideo('${v.id}', true)">
                  <div class="short-thumb">
                    <img src="${v.thumbnail}" alt="" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/mqdefault.jpg'">
                  </div>
                  <div class="short-info">
                    <div class="short-title">${escapeHtml(v.title)}</div>
                    <div class="short-channel">${escapeHtml(v.channel)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }

        // Regular feed
        html += `<div class="feed-grid">
          ${regular.map(v => `
            <div class="video-card">
              <div class="thumbnail-wrap" onclick="openVideo('${v.id}', false)">
                <img src="${v.thumbnail}" alt="" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/mqdefault.jpg'">
              </div>
              <div class="video-info" onclick="openVideo('${v.id}', false)">
                <div class="channel-avatar">
                  <div style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:#fff;">${(v.channel||'?')[0].toUpperCase()}</div>
                </div>
                <div class="video-meta">
                  <div class="video-title">${escapeHtml(v.title)}</div>
                  <div class="video-channel">${escapeHtml(v.channel)}</div>
                </div>
              </div>
              <div class="share-bar">
                <button class="share-btn" onclick="event.stopPropagation(); shareVideo('${v.id}', '${escapeAttr(v.title)}')">
                  <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                  Share
                </button>
              </div>
            </div>
          `).join('')}
        </div>`;

        $content.innerHTML = html;
      } catch (e) {
        $content.innerHTML = `
          <div class="error-msg">
            <p>Could not load videos.<br>Check your connection.</p>
            <button onclick="loadHome()">Retry</button>
          </div>
        `;
      } finally {
        isLoading = false;
      }
    }

    /* ---------- SEARCH (YouTube search page redirect method) ---------- */
    /* Kyunki koi free search API nahi bacha, hum user ko YouTube ki search page
       par redirect karenge. Wahan se video ID copy karke wapas M TUBE mein
       paste kar sakte hain. */
    function performSearch() {
      const q = $searchInput.value.trim();
      if (!q) return;
      searchQuery = q;
      currentTab = 'search';
      setActiveNav('search');
      $searchInput.blur();

      $content.innerHTML = `
        <div style="padding:16px;">
          <div class="search-results-header">Search: "${escapeHtml(q)}"</div>
          <div style="background:var(--surface);border-radius:var(--radius);padding:20px;margin-top:12px;text-align:center;">
            <p style="font-size:15px;line-height:1.6;margin-bottom:16px;">
              YouTube ne third-party search APIs block kar diye hain.<br>
              Neeche button dabayein — YouTube search khulega.<br>
              Wahan se video khol kar uska <strong>ID</strong> copy karein,<br>
              phir yahan wapas aakar "Play by ID" mein paste karein.
            </p>
            <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}"
               target="_blank" rel="noopener"
               style="display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
                      padding:12px 28px;border-radius:24px;font-weight:600;font-size:14px;">
              🔍 Open YouTube Search
            </a>
          </div>

          <div style="margin-top:24px;">
            <div class="section-title" style="padding-left:0;">Play by Video ID</div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <input type="text" id="manualVideoId" placeholder="e.g. dQw4w9WgXcQ"
                     style="flex:1;background:var(--surface);border:1px solid var(--border);
                            border-radius:12px;padding:12px 16px;color:var(--text);
                            font-size:15px;outline:none;">
              <button onclick="playManualId()"
                      style="background:var(--accent);color:#fff;border:none;
                             border-radius:12px;padding:0 20px;font-size:15px;
                             font-weight:600;cursor:pointer;">
                ▶
              </button>
            </div>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:8px;">
              YouTube URL mein <code>v=</code> ke baad wala code copy karein.
            </p>
          </div>
        </div>
      `;
    }

    function playManualId() {
      const id = document.getElementById('manualVideoId')?.value.trim();
      if (!id) { showToast('Video ID daalein'); return; }
      // Extract ID from URL if full URL pasted
      let videoId = id;
      if (id.includes('v=')) videoId = id.split('v=')[1].split('&')[0];
      else if (id.includes('youtu.be/')) videoId = id.split('youtu.be/')[1].split('?')[0];
      else if (id.includes('/shorts/')) videoId = id.split('/shorts/')[1].split('?')[0];
      openVideo(videoId, false);
    }

    /* ---------- SHORTS TAB ---------- */
    function goShorts() {
      currentTab = 'shorts';
      setActiveNav('shorts');

      const shortsList = CURATED_VIDEOS.filter(v => v.isShort);

      if (shortsList.length === 0) {
        $content.innerHTML = `<div class="empty-state"><p>No Shorts available.</p></div>`;
        return;
      }

      // Fetch metadata
      $content.innerHTML = `<div class="loading"><div class="spinner"></div>Loading Shorts...</div>`;

      Promise.all(shortsList.map(async (v) => {
        const meta = await fetchOEmbed(v.id);
        return {
          id: v.id,
          title: meta?.title || 'Short',
          thumbnail: meta?.thumbnail_url || `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`,
          channel: meta?.author_name || 'YouTube'
        };
      })).then(videos => {
        let html = `
          <div class="section-title">
            <svg class="shorts-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25.03.01 1.2.5 1.2.5L6 14.93c-1.83.97-2.53 3.24-1.56 5.07.97 1.83 3.24 2.53 5.07 1.56l8.5-4.5c1.29-.68 2.06-2.04 1.99-3.49-.07-1.42-.94-2.68-2.23-3.25zm-.23 5.86-8.5 4.5c-1.34.71-3.01.2-3.72-1.14-.71-1.34-.2-3.01 1.14-3.72l2.04-1.08v-1.21l-.69-.28-1.11-.46c-.99-.41-1.65-1.35-1.7-2.41-.05-1.06.52-2.06 1.46-2.56l8.5-4.5c1.34-.71 3.01-.2 3.72 1.14.71 1.34.2 3.01-1.14 3.72l-2.04 1.08v1.21l.69.28 1.11.46c.99.41 1.65 1.35 1.7 2.41.05 1.06-.52 2.06-1.46 2.56z"/></svg>
            Shorts
          </div>
          <div class="shorts-shelf" style="flex-wrap:wrap;overflow:visible;justify-content:center;">
            ${videos.map(v => `
              <div class="short-card" style="width:150px;" onclick="openVideo('${v.id}', true)">
                <div class="short-thumb">
                  <img src="${v.thumbnail}" alt="" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/mqdefault.jpg'">
                </div>
                <div class="short-info">
                  <div class="short-title">${escapeHtml(v.title)}</div>
                  <div class="short-channel">${escapeHtml(v.channel)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        $content.innerHTML = html;
      }).catch(() => {
        $content.innerHTML = `<div class="error-msg"><p>Could not load Shorts.</p><button onclick="goShorts()">Retry</button></div>`;
      });
    }

    /* ---------- OPEN PLAYER (Official YouTube Embed — NEVER BLOCKED) ---------- */
    async function openVideo(videoId, isShort) {
      if (!videoId) return;
      currentVideoId = videoId;

      // Official YouTube embed URL with referrerpolicy (YouTube requirement)
      const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;

      $playerVideoWrap.className = 'player-video-wrap' + (isShort ? ' vertical' : '');
      $playerVideoWrap.innerHTML = `
        <iframe
          src="${embedUrl}"
          allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          loading="eager">
        </iframe>
      `;

      // Fetch metadata via oEmbed
      $playerTitle.textContent = 'Loading...';
      $playerInfo.innerHTML = `<div class="loading"><div class="spinner"></div>Loading details...</div>`;

      const meta = await fetchOEmbed(videoId);
      if (meta) {
        $playerTitle.textContent = meta.title || 'Video';
        $playerInfo.innerHTML = `
          <div class="player-info-title">${escapeHtml(meta.title || '')}</div>
          <div class="player-info-channel">${escapeHtml(meta.author_name || '')}</div>
          <div class="player-share-row">
            <button class="share-btn" onclick="shareVideo('${videoId}', '${escapeAttr(meta.title || '')}')">
              <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
              Share
            </button>
            <button class="share-btn" onclick="window.open('https://www.youtube.com/watch?v=${videoId}','_blank')">
              <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
              YouTube
            </button>
          </div>
        `;
      } else {
        $playerTitle.textContent = 'Video';
        $playerInfo.innerHTML = `
          <div class="player-share-row">
            <button class="share-btn" onclick="shareVideo('${videoId}','')">
              <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
              Share
            </button>
          </div>
        `;
      }

      $playerOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closePlayer() {
      $playerOverlay.classList.remove('active');
      $playerVideoWrap.innerHTML = '';
      $playerInfo.innerHTML = '';
      $playerTitle.textContent = '';
      currentVideoId = null;
      document.body.style.overflow = '';
    }

    /* ---------- NAVIGATION ---------- */
    function setActiveNav(tab) {
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
    }

    function goHome() {
      $searchInput.value = '';
      loadHome();
    }

    function goSearch() {
      currentTab = 'search';
      setActiveNav('search');
      $searchInput.focus();
      if (searchQuery) performSearch();
      else {
        $content.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <p>Search for videos on YouTube</p>
          </div>`;
      }
    }

    /* ---------- EVENTS ---------- */
    $searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    window.addEventListener('popstate', () => {
      if ($playerOverlay.classList.contains('active')) {
        closePlayer();
        history.pushState(null, '', '');
      }
    });
    history.pushState(null, '', '');

    /* ---------- INIT ---------- */
    loadHome();
  </script>
</body>
</html>
