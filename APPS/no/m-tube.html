<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>M TUBE — Created by Muhammad Taqi</title>
<style>
/* ============================================================
   M TUBE — Design System
   ============================================================ */
:root{
  --bg:#0b0b0f;
  --bg-soft:#101017;
  --card:#16161d;
  --card-2:#1e1e28;
  --border:rgba(255,255,255,.08);
  --text:#f4f4f7;
  --muted:#9b9baa;
  --accent:#ff2d55;
  --accent2:#8b5cf6;
  --grad:linear-gradient(135deg,#ff2d55 0%,#8b5cf6 100%);
  --radius:16px;
  --shadow:0 12px 34px rgba(0,0,0,.5);
  --header-h:64px;
}
[data-theme="light"]{
  --bg:#f5f5f8;
  --bg-soft:#ffffff;
  --card:#ffffff;
  --card-2:#eeeef4;
  --border:rgba(0,0,0,.08);
  --text:#0c0c12;
  --muted:#63636f;
  --shadow:0 8px 24px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden;
  transition:background .25s,color .25s;
}
body.shorts-mode{overflow:hidden}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card-2);border-radius:20px;border:2px solid var(--bg)}

/* ================= HEADER ================= */
.topbar{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:10px;
  height:var(--header-h);padding:0 14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;user-select:none}
.brand-mark{
  width:36px;height:36px;border-radius:11px;
  background:var(--grad);
  display:grid;place-items:center;
  font-weight:900;font-size:19px;color:#fff;
  box-shadow:0 6px 18px rgba(255,45,85,.35);
  position:relative;
}
.brand-mark::after{
  content:"";position:absolute;inset:0;border-radius:11px;
  background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 60%);
}
.brand-name{
  font-weight:900;font-size:19px;letter-spacing:.5px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;
}
.search-form{
  flex:1;max-width:680px;margin:0 auto;
  display:flex;align-items:center;gap:8px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:999px;padding:5px 6px 5px 18px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.search-form:focus-within{
  border-color:transparent;
  box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(255,45,85,.16);
  background:var(--card-2);
}
.search-form input{flex:1;background:none;font-size:15px;min-width:0}
.search-form input::placeholder{color:var(--muted)}
.search-btn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;background:var(--grad);color:#fff;
  transition:transform .15s,filter .2s;
}
.search-btn:hover{transform:scale(1.06)}
.search-btn:active{transform:scale(.94)}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--card);border:1px solid var(--border);
  transition:background .2s,transform .15s;
}
.icon-btn:hover{background:var(--card-2)}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--grad);display:grid;place-items:center;
  font-weight:800;font-size:13px;color:#fff;flex-shrink:0;
  box-shadow:0 4px 14px rgba(139,92,246,.4);
}

/* ================= CHIPS ================= */
.chips-wrap{
  position:sticky;top:var(--header-h);z-index:150;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.chips{
  display:flex;gap:9px;padding:11px 16px;
  overflow-x:auto;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 16px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);
  font-size:13.5px;font-weight:600;color:var(--muted);
  white-space:nowrap;transition:all .18s;
}
.chip:hover{background:var(--card-2);color:var(--text)}
.chip.active{background:var(--text);color:var(--bg);border-color:transparent}

/* ================= LAYOUT ================= */
main{padding:22px 18px 120px;max-width:1800px;margin:0 auto}
.section-head{
  display:flex;align-items:center;gap:11px;margin:8px 0 16px;
}
.section-head h2{font-size:21px;font-weight:800;letter-spacing:-.3px}
.section-head .flame{font-size:22px}
.section-head .line{flex:1;height:1px;background:var(--border)}

/* ================= SHORTS RAIL (HOME) ================= */
.shorts-rail{
  display:flex;gap:13px;overflow-x:auto;padding:4px 2px 18px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.shorts-rail::-webkit-scrollbar{display:none}
.short-card{
  flex:0 0 168px;scroll-snap-align:start;cursor:pointer;
  transition:transform .2s;
}
.short-card:hover{transform:translateY(-4px)}
.short-thumb{
  position:relative;width:100%;aspect-ratio:9/16;
  border-radius:15px;overflow:hidden;background:var(--card-2);
  box-shadow:var(--shadow);
}
.short-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.short-card:hover .short-thumb img{transform:scale(1.07)}
.short-thumb::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 45%);
}
.short-label{
  position:absolute;left:9px;right:9px;bottom:9px;z-index:2;
  font-size:12.5px;font-weight:700;line-height:1.3;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 6px rgba(0,0,0,.7);
}
.short-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.16);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.4);
  display:grid;place-items:center;z-index:2;color:#fff;
  opacity:0;transition:opacity .2s,transform .2s;
}
.short-card:hover .short-play{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
.short-badge{
  position:absolute;top:9px;left:9px;z-index:2;
  background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;
  padding:3px 9px;border-radius:999px;letter-spacing:.4px;
}

/* ================= VIDEO GRID ================= */
.grid{
  display:grid;gap:26px 16px;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
}
.vcard{cursor:pointer;border-radius:var(--radius);transition:transform .2s}
.vcard:hover{transform:translateY(-3px)}
.vthumb{
  position:relative;width:100%;aspect-ratio:16/9;
  border-radius:var(--radius);overflow:hidden;background:var(--card-2);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.2,.8,.3,1)}
.vcard:hover .vthumb img{transform:scale(1.06)}
.badge{
  position:absolute;right:8px;bottom:8px;
  background:rgba(0,0,0,.82);color:#fff;
  font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:6px;
  letter-spacing:.3px;backdrop-filter:blur(4px);
}
.card-share{
  position:absolute;top:8px;right:8px;z-index:3;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.62);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.16);
  display:grid;place-items:center;color:#fff;
  opacity:0;transform:translateY(-6px);transition:all .2s;
}
.vcard:hover .card-share,.short-card:hover .card-share{opacity:1;transform:translateY(0)}
.card-share:hover{background:var(--accent);border-color:transparent;transform:scale(1.1)!important}
.card-share:active{transform:scale(.9)!important}

.vmeta{display:flex;gap:11px;padding:11px 4px 0}
.vavatar{
  width:37px;height:37px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
  background:var(--grad);
}
.vinfo{min-width:0;flex:1}
.vtitle{
  font-size:14.6px;font-weight:700;line-height:1.35;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:5px;
}
.vsub{font-size:12.8px;color:var(--muted);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= WATCH VIEW ================= */
.watch{max-width:1400px;margin:0 auto;display:grid;gap:26px;grid-template-columns:1fr}
@media(min-width:1080px){.watch{grid-template-columns:minmax(0,1fr) 380px}}
.player{
  width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  background:#000;box-shadow:var(--shadow);position:relative;
}
.player iframe{width:100%;height:100%;border:0;display:block}
.watch-title{font-size:21px;font-weight:800;line-height:1.32;margin:18px 0 12px;letter-spacing:-.4px}
.watch-meta{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--border);
}
.watch-meta .vavatar{width:44px;height:44px;font-size:17px}
.watch-chan{font-weight:700;font-size:15px}
.watch-sub{font-size:12.8px;color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-left:auto}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 17px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);
  font-size:13.6px;font-weight:700;transition:all .18s;
  white-space:nowrap;
}
.btn:hover{background:var(--card-2);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(255,45,85,.3)}
.btn svg{width:17px;height:17px;flex-shrink:0}

.related-list{display:flex;flex-direction:column;gap:12px}
.rel-item{display:flex;gap:11px;cursor:pointer;border-radius:12px;padding:5px;transition:background .18s}
.rel-item:hover{background:var(--card)}
.rel-thumb{
  position:relative;flex:0 0 168px;aspect-ratio:16/9;
  border-radius:11px;overflow:hidden;background:var(--card-2);
}
.rel-thumb img{width:100%;height:100%;object-fit:cover}
.rel-info{min-width:0;flex:1;padding-top:2px}
.rel-title{
  font-size:13.6px;font-weight:700;line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ================= SHORTS FEED (TIKTOK/YOUTUBE STYLE) ================= */
.shorts-stage{
  position:fixed;
  top:var(--header-h);
  left:0;right:0;bottom:0;
  background:#000;
  z-index:100;
  overflow:hidden;
}
.shorts-feed{
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}
.shorts-feed::-webkit-scrollbar{display:none}
.feed-item{
  height:100%;
  width:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
}
.feed-box{
  position:relative;
  height:calc(100% - 24px);
  aspect-ratio:9/16;
  max-width:calc(100vw - 40px);
  border-radius:18px;
  overflow:hidden;
  background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.feed-poster{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  transition:opacity .35s ease;
  z-index:1;
}
.feed-frame{
  position:absolute;inset:0;
  z-index:2;
}
.feed-frame iframe{
  width:100%;height:100%;
  border:0;display:block;
  background:#000;
}
.feed-tapzone{
  position:absolute;inset:0;
  z-index:3;
  cursor:pointer;
}
.feed-pause-indicator{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(1.2);
  width:74px;height:74px;border-radius:50%;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  display:grid;place-items:center;
  color:#fff;z-index:5;
  opacity:0;
  transition:opacity .25s, transform .25s;
  pointer-events:none;
}
.feed-pause-indicator.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}
.feed-hint{
  position:absolute;left:50%;bottom:22px;
  transform:translateX(-50%);
  z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:#fff;font-size:12px;font-weight:700;
  text-shadow:0 2px 10px rgba(0,0,0,.9);
  animation:bounceHint 1.8s ease-in-out infinite;
  pointer-events:none;
  opacity:.9;
}
@keyframes bounceHint{
  0%,100%{transform:translate(-50%,0);opacity:.85}
  50%{transform:translate(-50%,-8px);opacity:1}
}
.feed-side{
  position:absolute;
  right:max(12px, calc(50% - 240px));
  bottom:90px;
  z-index:6;
  display:flex;flex-direction:column;gap:16px;
  align-items:center;
}
@media(max-width:640px){
  .feed-side{right:10px;bottom:110px;gap:14px}
}
.feed-fab{
  width:52px;height:52px;border-radius:50%;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);
  display:grid;place-items:center;
  color:#fff;
  transition:all .18s;
  position:relative;
}
.feed-fab:hover{background:rgba(255,45,85,.85);transform:scale(1.08)}
.feed-fab:active{transform:scale(.9)}
.feed-fab svg{width:24px;height:24px}
.feed-fab .fab-label{
  position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:700;color:#fff;opacity:.85;white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
}
.feed-fab.liked{background:var(--accent);border-color:transparent}
.feed-fab.liked svg{fill:#fff;stroke:#fff}
.feed-caption{
  position:absolute;
  left:max(20px, calc(50% - 240px));
  right:max(100px, calc(50% - 130px));
  bottom:24px;
  z-index:6;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.9);
}
@media(max-width:640px){
  .feed-caption{left:14px;right:90px;bottom:22px}
}
.feed-caption .fc-chan{
  display:flex;align-items:center;gap:9px;margin-bottom:8px;
}
.feed-caption .fc-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--grad);
  display:grid;place-items:center;
  font-weight:800;font-size:13px;color:#fff;
  border:1.5px solid rgba(255,255,255,.5);
  flex-shrink:0;
}
.feed-caption .fc-name{font-size:13.5px;font-weight:800}
.feed-caption .fc-sub{
  margin-left:auto;
  font-size:11.5px;font-weight:800;
  padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.2);
}
.feed-caption h4{
  font-size:13.8px;font-weight:600;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  opacity:.95;
}

.feed-loader{
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;color:#fff;font-size:14px;font-weight:600;
}
.spinner{
  width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.feed-progress{
  position:absolute;
  top:14px;left:50%;transform:translateX(-50%);
  z-index:8;
  display:flex;gap:4px;
  padding:6px 12px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(12px);
  border-radius:999px;
  border:1px solid rgba(255,255,255,.1);
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
}
.feed-progress.show{opacity:1}
.feed-progress .dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.35);
  transition:all .2s;
}
.feed-progress .dot.active{
  background:#fff;width:22px;border-radius:99px;
}
.shorts-close{
  position:absolute;
  top:14px;left:14px;
  z-index:9;
  width:42px;height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);
  display:grid;place-items:center;
  color:#fff;
  transition:all .18s;
}
.shorts-close:hover{background:rgba(255,45,85,.9);transform:rotate(90deg)}

/* ================= SKELETON ================= */
.sk{background:var(--card);border-radius:14px;position:relative;overflow:hidden}
.sk::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.sk-thumb{width:100%;aspect-ratio:16/9;border-radius:16px}
.sk-line{height:13px;border-radius:6px;margin-top:9px}
.sk-short{flex:0 0 168px;aspect-ratio:9/16;border-radius:15px}

/* ================= STATES ================= */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .em{font-size:54px;margin-bottom:14px;opacity:.55}
.empty h3{font-size:19px;font-weight:800;color:var(--text);margin-bottom:7px}
.empty p{font-size:14px;max-width:400px;margin:0 auto 18px;line-height:1.6}

/* ================= SHARE SHEET ================= */
.backdrop{
  position:fixed;inset:0;z-index:900;
  background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.backdrop.show{opacity:1;pointer-events:auto}
@media(min-width:640px){.backdrop{align-items:center}}
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:26px 26px 0 0;
  padding:8px 20px 28px;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.16,1,.3,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
}
@media(min-width:640px){
  .sheet{border-radius:26px;transform:translateY(20px) scale(.96);opacity:0}
}
.backdrop.show .sheet{transform:translateY(0) scale(1);opacity:1}
.grabber{width:42px;height:4.5px;border-radius:99px;background:var(--border);margin:8px auto 18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sheet-head h3{font-size:18px;font-weight:800;letter-spacing:-.3px}
.sheet-close{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);color:var(--muted);transition:all .18s;
}
.sheet-close:hover{background:var(--card-2);color:var(--text);transform:rotate(90deg)}
.share-preview{
  display:flex;gap:12px;align-items:center;
  background:var(--card);border:1px solid var(--border);
  border-radius:15px;padding:11px;margin-bottom:20px;
}
.share-preview img{width:92px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex-shrink:0}
.share-preview .sp-info{min-width:0}
.share-preview .sp-info h4{
  font-size:13.6px;font-weight:700;line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.share-preview .sp-info p{font-size:12px;color:var(--muted)}
.share-apps{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:14px 8px;margin-bottom:22px;
}
.share-app{

<script>
/* ============================================================
   M TUBE — Created by MUHAMMAD TAQI
   ============================================================ */

/* ---------- MIRRORS ---------- */
const INVIDIOUS = [
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',
  'https://yewtu.be',
  'https://invidious.f5.si',
  'https://iv.melmac.space',
  'https://invidious.privacyredirect.com',
  'https://inv.tux.pizza'
];

const PIPED = [
  'https://pipedapi.kavin.rocks',
  'https://pipedapi.adminforge.de',
  'https://api.piped.private.coffee',
  'https://pipedapi.reallyaweso.me'
];

const SITE_URL = location.href.split('#')[0];

/* ---------- DOM ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const main = $('#main');
const chipsEl = $('#chips');
const chipsWrap = $('#chipsWrap');
const searchInput = $('#searchInput');
const pageFooter = $('#pageFooter');

/* ---------- STATE ---------- */
const VIDEO_CACHE = new Map();
let currentShare = null;
let currentView = 'home';

/* Shorts feed state */
let feedObserver = null;
let feedVideos = [];
let feedMuted = true;
let feedLoading = false;
let feedExhausted = false;
let feedSeedQuery = '';

/* ============================================================
   UTILITIES
   ============================================================ */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmtViews(n){
  if (n === null || n === undefined || n === '') return '';
  n = Number(n);
  if (isNaN(n)) return '';
  if (n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'') + 'B views';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M views';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K views';
  return n.toLocaleString() + ' views';
}
function fmtDur(sec){
  sec = Number(sec) || 0;
  if (!sec) return '';
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = Math.floor(sec%60);
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}
function toast(msg, icon = '✅'){
  const t = $('#toast');
  t.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}
async function copyText(text){
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  } catch(e){ return false; }
}

/* ---------- Mirror racing ---------- */
function raceMirrors(bases, build, timeout = 8000){
  const attempts = bases.map(async base => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(build(base), { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || (Array.isArray(data) && !data.length)) throw new Error('empty');
      return data;
    } finally { clearTimeout(timer); }
  });
  return Promise.any(attempts);
}

/* ============================================================
   NORMALIZERS
   ============================================================ */
function thumbFor(id, quality = 'mq'){
  return `https://i.ytimg.com/vi/${id}/${quality}default.jpg`;
}
function normInvidious(v){
  const id = v.videoId;
  return {
    id,
    title: v.title || 'Untitled',
    author: v.author || 'Unknown',
    authorId: v.authorId || '',
    thumb: thumbFor(id),
    duration: v.lengthSeconds || 0,
    views: v.viewCount || 0,
    published: v.publishedText || ''
  };
}
function normPiped(v){
  const id = (v.url || '').split('v=')[1] || v.videoId;
  if (!id) return null;
  return {
    id,
    title: v.title || 'Untitled',
    author: v.uploaderName || 'Unknown',
    authorId: (v.uploaderUrl || '').replace('/channel/',''),
    thumb: thumbFor(id),
    duration: v.duration || 0,
    views: v.views || 0,
    published: v.uploadedDate || ''
  };
}
function cacheAll(list){
  list.forEach(v => { if (v && v.id) VIDEO_CACHE.set(v.id, v); });
  return list;
}

/* ============================================================
   API LAYER
   ============================================================ */
async function apiTrending(){
  try {
    const data = await raceMirrors(INVIDIOUS, b => `${b}/api/v1/trending?region=US&type=Default`);
    const list = (Array.isArray(data) ? data : [])
      .filter(x => x.type === 'video' && x.videoId)
      .map(normInvidious);
    if (list.length) return cacheAll(list);
    throw new Error('none');
  } catch(e){
    const data = await raceMirrors(PIPED, b => `${b}/trending?region=US`);
    const list = (Array.isArray(data) ? data : [])
      .filter(x => x.type === 'stream' && (x.url||'').includes('v='))
      .map(normPiped).filter(Boolean);
    return cacheAll(list);
  }
}
async function apiSearch(query, opts = {}){
  const q = (query || '').trim();
  if (!q) return [];
  try {
    let url = `/api/v1/search?q=${encodeURIComponent(q)}&type=video&page=1`;
    if (opts.duration) url += `&duration=${opts.duration}`;
    if (opts.sort)     url += `&sort_by=${opts.sort}`;
    const data = await raceMirrors(INVIDIOUS, b => b + url);
    const list = (Array.isArray(data) ? data : [])
      .filter(x => x.type === 'video' && x.videoId)
      .map(normInvidious);
    if (list.length) return cacheAll(list);
    throw new Error('none');
  } catch(e){
    const data = await raceMirrors(PIPED,
      b => `${b}/search?q=${encodeURIComponent(q)}&filter=videos`);
    const list = (data.items || [])
      .filter(x => x.type === 'stream' && (x.url||'').includes('v='))
      .map(normPiped).filter(Boolean);
    return cacheAll(list);
  }
}
async function apiShorts(seedQuery){
  const queries = [
    '#shorts', 'shorts viral', 'trending shorts',
    'funny shorts', 'dance shorts', 'music shorts',
    'youtube shorts 2024', 'viral shorts'
  ];
  const q = seedQuery || queries[Math.floor(Math.random() * queries.length)];
  try {
    const list = await apiSearch(q, { duration: 'short' });
    const shorts = list.filter(v => v.duration && v.duration <= 180);
    return shorts.length >= 6 ? shorts : list.slice(0, 24);
  } catch(e){ return []; }
}
async function apiRelated(id){
  try {
    const data = await raceMirrors(INVIDIOUS, b => `${b}/api/v1/videos/${id}`);
    const rel = (data.recommendedVideos || [])
      .filter(x => x.videoId).map(normInvidious);
    if (rel.length) return cacheAll(rel);
    throw new Error('none');
  } catch(e){
    try {
      const data = await raceMirrors(PIPED, b => `${b}/streams/${id}`);
      const rel = (data.relatedStreams || [])
        .filter(x => x.type === 'stream' && (x.url||'').includes('v='))
        .map(normPiped).filter(Boolean);
      return cacheAll(rel);
    } catch(err){ return []; }
  }
}

/* ============================================================
   THEME
   ============================================================ */
(function initTheme(){
  const saved = localStorage.getItem('mtube-theme');
  if (saved) document.documentElement.dataset.theme = saved;
})();
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  localStorage.setItem('mtube-theme', next);
  document.querySelector('meta[name="theme-color"]')
    .setAttribute('content', next === 'dark' ? '#0b0b0f' : '#f5f5f8');
  toast(next === 'dark' ? 'Dark mode' : 'Light mode', next === 'dark' ? '🌙' : '☀️');
});

/* ============================================================
   CHIPS
   ============================================================ */
const CATEGORIES = [
  { label: 'All',       icon: '🏠', type: 'home' },
  { label: 'Shorts',    icon: '⚡', type: 'shorts' },
  { label: 'Music',     icon: '🎵', q: 'music' },
  { label: 'Gaming',    icon: '🎮', q: 'gaming' },
  { label: 'Live',      icon: '🔴', q: 'live' },
  { label: 'News',      icon: '📰', q: 'news' },
  { label: 'Movies',    icon: '🎬', q: 'movie trailer' },
  { label: 'Sports',    icon: '⚽', q: 'sports highlights' },
  { label: 'Learning',  icon: '📚', q: 'learn programming' },
  { label: 'Podcasts',  icon: '🎙️', q: 'podcast' },
  { label: 'Cooking',   icon: '🍳', q: 'cooking recipe' },
  { label: 'Tech',      icon: '💻', q: 'tech review' }
];
function renderChips(activeLabel = 'All'){
  chipsEl.innerHTML = CATEGORIES.map(c => `
    <button class="chip ${c.label === activeLabel ? 'active' : ''}"
            data-chip="${esc(c.label)}">${c.icon} ${esc(c.label)}</button>
  `).join('');
}
chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-chip]');
  if (!btn) return;
  const cat = CATEGORIES.find(c => c.label === btn.dataset.chip);
  if (!cat) return;
  renderChips(cat.label);
  if (cat.type === 'home')        showHome();
  else if (cat.type === 'shorts') showShorts();
  else                            showSearch(cat.q, cat.label);
});

/* ============================================================
   RENDER HELPERS
   ============================================================ */
const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
  <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
  <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>`;

function videoCard(v){
  return `
  <article class="vcard" data-video="${esc(v.id)}">
    <div class="vthumb">
      <img loading="lazy" src="${esc(v.thumb)}" alt="${esc(v.title)}"
           onerror="this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg'">
      ${v.duration ? `<span class="badge">${fmtDur(v.duration)}</span>` : ''}
      <button class="card-share" data-share="${esc(v.id)}" title="Share" aria-label="Share">${SHARE_ICON}</button>
    </div>
    <div class="vmeta">
      <div class="vavatar">${esc((v.author || '?').trim()[0].toUpperCase())}</div>
      <div class="vinfo">
        <h3 class="vtitle">${esc(v.title)}</h3>
        <p class="vsub">${esc(v.author)}</p>
        <p class="vsub">${fmtViews(v.views)}${v.published ? ' • ' + esc(v.published) : ''}</p>
      </div>
    </div>
  </article>`;
}
function shortCard(v){
  return `
  <div class="short-card" data-video="${esc(v.id)}" data-short="1">
    <div class="short-thumb">
      <img loading="lazy" src="${esc(v.thumb)}" alt="${esc(v.title)}"
           onerror="this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg'">
      <span class="short-badge">SHORT</span>
      <div class="short-play">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="short-label">${esc(v.title)}</div>
      <button class="card-share" data-share="${esc(v.id)}" title="Share" aria-label="Share">${SHARE_ICON}</button>
    </div>
  </div>`;
}
function skeletonGrid(count = 12){
  return `<div class="grid">${Array.from({length: count}).map(() => `
    <div>
      <div class="sk sk-thumb"></div>
      <div class="sk sk-line" style="width:88%"></div>
      <div class="sk sk-line" style="width:58%"></div>
      <div class="sk sk-line" style="width:40%"></div>
    </div>`).join('')}</div>`;
}
function skeletonRail(){
  return `<div class="shorts-rail">${Array.from({length: 8})
    .map(() => `<div class="sk sk-short"></div>`).join('')}</div>`;
}
function emptyState(icon, title, text, actionLabel, actionId){
  return `
  <div class="empty">
    <div class="em">${icon}</div>
    <h3>${esc(title)}</h3>
    <p>${esc(text)}</p>
    ${actionLabel ? `<button class="btn primary" id="${actionId}">${esc(actionLabel)}</button>` : ''}
  </div>`;
}

/* ============================================================
   VIEW: HOME
   ============================================================ */
async function showHome(){
  currentView = 'home';
  setActiveNav('home');
  exitShortsMode();
  chipsWrap.style.display = '';
  pageFooter.style.display = '';
  renderChips('All');

  main.innerHTML = `
    <div class="section-head">
      <span class="flame">⚡</span>
      <h2>Shorts</h2>
      <div class="line"></div>
      <button class="btn" id="seeAllShorts" style="padding:7px 15px;font-size:12.5px">See all</button>
    </div>
    <div id="shortsArea">${skeletonRail()}</div>

    <div class="section-head" style="margin-top:26px">
      <span class="flame">🔥</span>
      <h2>Trending on M TUBE</h2>
      <div class="line"></div>
    </div>
    <div id="videosArea">${skeletonGrid(12)}</div>
  `;

  $('#seeAllShorts').addEventListener('click', () => { location.hash = '#shorts'; });

  apiShorts().then(list => {

    if (!area) return;
    area.innerHTML = list.length
      ? `<div class="shorts-rail">${list.slice(0, 18).map(shortCard).join('')}</div>`
      : emptyState('⚡', 'No shorts found', 'Try again in a moment.', null, null);
  }).catch(() => {
    const area = $('#shortsArea');
    if (area) area.innerHTML = '';
  });

  try {
    const vids = await apiTrending();
    const area = $('#videosArea');
    if (!area) return;
    area.innerHTML = vids.length
      ? `<div class="grid">${vids.map(videoCard).join('')}</div>`

        'All mirrors are busy. Please check your internet and try again.',
        'Try again', 'retryHome');
      const retry = $('#retryHome');
      if (retry) retry.addEventListener('click', showHome);
    }
  }
}

function setupFeedObserver(){
  const feed = $('#shortsFeed');
  if (!feed) return;
  const items = [...feed.querySelectorAll('.feed-item[data-video]')];

  if (feedObserver) feedObserver.disconnect();

  feedObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const item = entry.target;
      const ratio = entry.intersectionRatio;
      if (entry.isIntersecting && ratio >= 0.65){
        if (item.dataset.active !== '1'){
          activateShort(item);
          updateFeedProgress();
        }
      } else if (ratio < 0.4){
        if (item.dataset.active === '1'){
          deactivateShort(item);
        }
      }
    });
  }, {
    root: feed,
    threshold: [0, 0.4, 0.65, 0.9, 1]
  });

  items.forEach(el => feedObserver.observe(el));
}

function activateShort(item){
  const id = item.dataset.video;
  if (!id) return;
  item.dataset.active = '1';

  const frame = item.querySelector('.feed-frame');
  const poster = item.querySelector('.feed-poster');

  if (!frame.dataset.loaded){
    const muteParam = feedMuted ? 1 : 0;
    frame.innerHTML = `<iframe
      src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=${muteParam}&loop=1&playlist=${id}&enablejsapi=1&playsinline=1&rel=0&modestbranding=1&controls=0&iv_load_policy=3&fs=0"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
      frameborder="0"
      title="M TUBE Short"></iframe>`;
    frame.dataset.loaded = '1';

    /* Hide poster once iframe is mounted */
    if (poster) poster.style.opacity = '0';
  } else {
    const iframe = frame.querySelector('iframe');
    if (iframe){
      postYT(iframe, 'playVideo');
      postYT(iframe, feedMuted ? 'mute' : 'unMute');
    }
  }
}

function deactivateShort(item){
  if (item.dataset.active !== '1') return;
  item.dataset.active = '0';
  const iframe = item.querySelector('.feed-frame iframe');
  if (iframe){
    postYT(iframe, 'pauseVideo');
    postYT(iframe, 'seekTo', [0, true]);
  }
  const poster = item.querySelector('.feed-poster');
  if (poster) poster.style.opacity = '1';
}

/* Send a YouTube IFrame API command */
function postYT(iframe, func, args = []){
  try {
    iframe.contentWindow.postMessage(JSON.stringify({
      event: 'command', func, args
    }), '*');
  } catch(e){}
}

function updateFeedProgress(){
  const feed = $('#shortsFeed');
  const bar = $('#feedProgress');
  if (!feed || !bar) return;

  const items = [...feed.querySelectorAll('.feed-item[data-video]')];
  if (!items.length){ bar.classList.remove('show'); return; }

  const active = items.find(el => el.dataset.active === '1');
  const idx = active ? Number(active.dataset.index) : 0;

  const total = Math.min(items.length, 8);
  const start = Math.max(0, Math.min(idx - 3, items.length - total));
  const slice = items.slice(start, start + total);

  bar.innerHTML = slice.map((el) => {
    const i = Number(el.dataset.index);
    return `<span class="dot ${i === idx ? 'active' : ''}"></span>`;
  }).join('');
  bar.classList.add('show');
}

function attachFeedHandlers(){
  const feed = $('#shortsFeed');
  if (!feed) return;

  feed.addEventListener('click', async e => {
    const item = e.target.closest('.feed-item[data-video]');
    if (!item) return;
    const id = item.dataset.video;

    const actionEl = e.target.closest('[data-action]');
    const action = actionEl ? actionEl.dataset.action : null;

    if (action === 'toggle'){
      const iframe = item.querySelector('.feed-frame iframe');
      if (!iframe) return;
      const isActive = item.dataset.active === '1';
      const indicator = item.querySelector('[data-pause-ind]');
      if (isActive){
        postYT(iframe, 'pauseVideo');
        item.dataset.paused = '1';
        if (indicator) indicator.classList.add('show');
      } else {
        postYT(iframe, 'playVideo');
        item.dataset.paused = '0';
        if (indicator) indicator.classList.remove('show');
      }
      return;
    }

    if (action === 'like'){
      actionEl.classList.toggle('liked');
      toast(actionEl.classList.contains('liked') ? 'Added to likes' : 'Like removed', '❤️');
      return;
    }
    if (action === 'dislike'){
      toast('Feedback recorded', '👎');
      return;
    }
    if (action === 'comments'){
      toast('Comments coming soon', '💬');
      return;
    }
    if (action === 'share'){
      shareVideo(id);
      return;
    }
    if (action === 'sub'){
      toast('Subscribed to channel', '🔔');
      actionEl.textContent = 'Subscribed';
      actionEl.disabled = true;
      return;
    }
    if (action === 'mute'){
      feedMuted = !feedMuted;
      $$('.feed-item[data-active="1"] .feed-frame iframe').forEach(f => {
        postYT(f, feedMuted ? 'mute' : 'unMute');
      });
      /* Swap icon across all mute buttons */
      $$('.feed-fab[data-action="mute"]').forEach(btn => {
        const svg = btn.querySelector('.mute-icon');
        const label = btn.querySelector('.fab-label');
        if (feedMuted){
          svg.innerHTML = `
            <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>`;
          if (label) label.textContent = 'Mute';
        } else {
          svg.innerHTML = `
            <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M19 5a9 9 0 0 1 0 14"/>`;
          if (label) label.textContent = 'Sound';
        }
      });
      toast(feedMuted ? 'Muted' : 'Sound on', feedMuted ? '🔇' : '🔊');
      return;
    }
    if (action === 'watch'){
      location.hash = `watch=${id}`;
      return;
    }
  });

  /* Clean up when leaving */
  feed.addEventListener('scroll', () => {
    const item = feed.querySelector('.feed-item[data-active="1"]');
    if (item){
      const indicator = item.querySelector('[data-pause-ind]');
      if (indicator) indicator.classList.remove('show');
      item.dataset.paused = '0';
    }
  }, { passive: true });
}

function setupFeedInfiniteScroll(){
  const feed = $('#shortsFeed');
  if (!feed) return;

  let ticking = false;
  feed.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const nearEnd = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - feed.clientHeight * 2.5;
      if (nearEnd && !feedLoading && !feedExhausted){
        loadMoreShorts();
      }
    });
  }, { passive: true });
}

async function loadMoreShorts(){
  if (feedLoading || feedExhausted) return;
  feedLoading = true;

  try {
    const seeds = ['viral shorts', 'trending shorts', '#shorts', 'funny shorts', 'dance shorts'];
    const q = seeds[Math.floor(Math.random() * seeds.length)];
    const list = await apiShorts(q);

    const existing = new Set(feedVideos.map(v => v.id));
    const fresh = list.filter(v => !existing.has(v.id)).slice(0, 12);

    const feed = $('#shortsFeed');
    if (!feed) return;
    const endEl = feed.querySelector('[data-end="1"]');

    if (!fresh.length){
      feedExhausted = true;
      if (endEl) endEl.innerHTML = `
        <div class="feed-loader">
          <div style="font-size:38px;opacity:.5">✨</div>
          <p>You're all caught up</p>
        </div>`;
      return;
    }

    const startIndex = feedVideos.length;
    const html = fresh.map((v,i) => buildFeedItem(v, startIndex + i)).join('');
    if (endEl) endEl.insertAdjacentHTML('beforebegin', html);
    else feed.insertAdjacentHTML('beforeend', html);

    /* Track new videos */
    fresh.forEach(v => {
      feedVideos.push(v);
      VIDEO_CACHE.set(v.id, v);
    });

    /* Observe new items */
    const newItems = [...feed.querySelectorAll('.feed-item[data-video]')]
      .filter(el => !el.dataset.observed);
    newItems.forEach(el => {
      el.dataset.observed = '1';
      if (feedObserver) feedObserver.observe(el);
    });
  } catch(e){
    /* silent */
  } finally {
    feedLoading = false;
  }
}

    url: (u,t) => `https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(t)}` },
  { name: 'Facebook', emoji: '📘', bg: 'linear-gradient(135deg,#1877F2,#0b5ed7)',
    url: (u) => `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(u)}` },
  { name: 'X / Twitter', emoji: '𝕏', bg: 'linear-gradient(135deg,#1a1a1a,#000)',
    url: (u,t) => `https://twitter.com/intent/tweet?url=${encodeURIComponent(u)}&text=${encodeURIComponent(t)}` },
  { name: 'Reddit', emoji: '👽', bg: 'linear-gradient(135deg,#FF4500,#FF8717)',
    url: (u,t) => `https://www.reddit.com/submit?url=${encodeURIComponent(u)}&title=${encodeURIComponent(t)}` },
  { name: 'Email', emoji: '📧', bg: 'linear-gradient(135deg,#EA4335,#c5221f)',
    url: (u,t) => `mailto:?subject=${encodeURIComponent(t)}&body=${encodeURIComponent(u)}` },
  { name: 'SMS', emoji: '💌', bg: 'linear-gradient(135deg,#34C759,#1a9e42)',
    url: (u,t) => `sms:?&body=${encodeURIComponent(t + ' ' + u)}` },
  { name: 'Download', emoji: '⬇️', bg: 'linear-gradient(135deg,#8b5cf6,#6d28d9)',
    url: (u) => `https://ssyoutube.com/watch?v=${u.split('/').pop()}` },
  { name: 'More apps', emoji: '⋯', bg: 'linear-gradient(135deg,#4b5563,#374151)', native: true }
];

function renderShareApps(){
  const wrap = $('#shareApps');
  wrap.innerHTML = SHARE_APPS.map((app, i) => `
    <button class="share-app" data-app="${i}">
      <span class="app-icon" style="background:${app.bg};color:#fff">${app.emoji}</span>
      <span class="app-name">${esc(app.name)}</span>
    </button>`).join('');
}

function openShare(id){
  const v = VIDEO_CACHE.get(id) || { id, title: 'M TUBE Video', author: '' };
  const ytUrl = `https://youtu.be/${id}`;
  const mtUrl = `${SITE_URL}#watch=${id}`;

  currentShare = { id, title: v.title, ytUrl, mtUrl };

  $('#spThumb').src = thumbFor(id, 'mq');
  $('#spThumb').onerror = function(){ this.src = thumbFor(id, 'hq'); };
  $('#spTitle').textContent = v.title || 'M TUBE Video';
  $('#spAuthor').textContent = v.author || 'M TUBE';
  $('#ytLink').textContent = ytUrl;
  $('#mtLink').textContent = mtUrl;

  $$('.copy-btn').forEach(b => { b.classList.remove('done'); b.textContent = 'Copy'; });
  renderShareApps();
  $('#shareBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeShare(){
  $('#shareBackdrop').classList.remove('show');
  document.body.style.overflow = '';
}

$('#shareClose').addEventListener('click', closeShare);
$('#shareBackdrop').addEventListener('click', e => {
  if (e.target === $('#shareBackdrop')) closeShare();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeShare();
});

$('#shareApps').addEventListener('click', async e => {
  const btn = e.target.closest('[data-app]');
  if (!btn || !currentShare) return;
  const app = SHARE_APPS[Number(btn.dataset.app)];
  if (!app) return;
  const text = `${currentShare.title} — M TUBE`;

  if (app.native){
    if (navigator.share){
      try {
        await navigator.share({
          title: currentShare.title + ' | M TUBE',
          text, url: currentShare.ytUrl
        });
        return;
      } catch(err){
        if (err && err.name === 'AbortError') return;
      }
    }
    toast('Sharing not supported here', '⚠️');
    return;
  }
  window.open(app.url(currentShare.ytUrl, text), '_blank', 'noopener,noreferrer');
});

$$('.copy-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (!currentShare) return;
    const val = btn.dataset.copy === 'yt' ? currentShare.ytUrl : currentShare.mtUrl;
    const ok = await copyText(val);
    if (ok){
      btn.textContent = 'Copied!';
      btn.classList.add('done');
      toast('Link copied — share to any app', '📋');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
    } else toast('Copy failed', '⚠️');
  });
});

async function shareVideo(id){
  const v = VIDEO_CACHE.get(id) || { id, title: 'M TUBE Video' };
  const ytUrl = `https://youtu.be/${id}`;
  const text = `${v.title} — M TUBE`;

  if (navigator.share){
    try {
      await navigator.share({ title: v.title + ' | M TUBE', text, url: ytUrl });
      return;
    } catch(err){
      if (err && err.name === 'AbortError') return;
    }
  }
  openShare(id);
}

/* ============================================================
   GLOBAL CLICK DELEGATION (main content)
   ============================================================ */
main.addEventListener('click', e => {
  /* Skip when inside shorts feed — handled separately */
  if (e.target.closest('.shorts-feed')) return;

  const shareBtn = e.target.closest('[data-share]');
  if (shareBtn){
    e.preventDefault(); e.stopPropagation();
    shareVideo(shareBtn.dataset.share);
    return;
  }

  const card = e.target.closest('[data-video]');
  if (card){
    location.hash = `watch=${card.dataset.video}`;
  }
});

/* ============================================================
   SEARCH
   ============================================================ */
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = searchInput.value.trim();
  if (!q) return;
  searchInput.blur();
  location.hash = `search=${encodeURIComponent(q)}`;
});

/* ============================================================
   BOTTOM NAV
   ============================================================ */
function setActiveNav(name){
  $$('.bn-item').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
}
$$('.bn-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const nav = btn.dataset.nav;
    if (nav === 'home')   { location.hash = ''; showHome(); }
    if (nav === 'shorts') { location.hash = '#shorts'; }
    if (nav === 'search') { window.scrollTo({top:0,behavior:'smooth'}); setTimeout(() => searchInput.focus(), 200); }
    if (nav === 'top')    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

$('#shortsBtn').addEventListener('click', () => { location.hash = '#shorts'; });
$('#brandLink').addEventListener('click', e => {
  e.preventDefault();
  location.hash = '';
  showHome();
});

/* ============================================================
   ROUTER
   ============================================================ */
function route(){
  const hash = location.hash;

  if (hash === '#shorts' || hash === '#shorts='){
    showShorts();
    return;
  }

  if (hash.startsWith('#watch=')){
    const id = hash.slice(7);
    if (id) { showWatch(id); return; }
  }

  if (hash.startsWith('#search=')){
    const q = decodeURIComponent(hash.slice(8));
    if (q) { showSearch(q); return; }
  }

  showHome();
}

window.addEventListener('hashchange', route);

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  renderChips('All');
  renderShareApps();
  route();

  console.log('%c M TUBE ', 'background:linear-gradient(135deg,#ff2d55,#8b5cf6);color:#fff;font-weight:900;padding:4px 10px;border-radius:6px;font-size:14px');
  console.log('%c Created by MUHAMMAD TAQI ', 'color:#8b5cf6;font-weight:700;font-size:12px');
})();
</script>
