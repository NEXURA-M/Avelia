<!DOCTYPE html>
<!-- saved from url=(0052)https://muhammadtaqi512q-oss.github.io/TAQI-BROWSER/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAQI Browser</title>
          <link rel="icon" type="image/png" href="https://muhammadtaqi512q-oss.github.io/TAQI-BROWSER/icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background: #ffffff; color: #202124; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .browser-toolbar { display: flex; align-items: center; padding: 8px 14px; background: #fff; border-bottom: 1px solid #e0e0e0; gap: 12px; z-index: 10; }
        .nav-icons { display: flex; align-items: center; gap: 10px; color: #5f6368; }
        .nav-btn { background: none; border: none; cursor: pointer; color: #5f6368; display: flex; align-items: center; justify-content: center; border-radius: 50%; padding: 6px; transition: background 0.2s; }
        .nav-btn:hover { background: #f1f3f4; }
        .address-bar-wrapper { flex: 1; display: flex; align-items: center; background: #f1f3f4; border-radius: 20px; padding: 0 16px; height: 38px; border: 1px solid transparent; transition: all 0.2s; }
        .address-bar-wrapper:focus-within { background: #fff; border-color: #003366; box-shadow: 0 1px 6px rgba(0,51,102,0.2); }
        .top-t-logo { width: 20px; height: 20px; background: #003366; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; margin-right: 10px; flex-shrink: 0; }
        .top-url-input { width: 100%; border: none; outline: none; background: transparent; font-size: 14px; color: #3c4043; }
        .toolbar-actions { display: flex; align-items: center; gap: 12px; color: #5f6368; }
        .user-profile-circle { width: 28px; height: 28px; background: #202124; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }

        .main-viewport { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 15vh; overflow-y: auto; transition: padding-top 0.3s ease; }
        .brand-title { font-size: 82px; font-weight: 700; color: #003366; letter-spacing: -1.5px; margin-bottom: 28px; user-select: none; }
        .center-search-wrapper { width: 550px; max-width: 90vw; position: relative; flex-shrink: 0; }
        .center-search-input { width: 100%; height: 48px; padding: 0 20px 0 48px; font-size: 15px; background: #fff; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; color: #202124; transition: all 0.2s ease; }
        .center-search-input:hover, .center-search-input:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }
        .search-glass-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: #5f6368; pointer-events: none; }

        .results-container { display: none; flex-direction: column; width: 100%; max-width: 620px; margin-top: 10px; margin-bottom: 40px; text-align: left; }
        .back-btn { background: none; border: none; color: #003366; cursor: pointer; font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; font-weight: 600; padding: 5px 0; }
        .back-btn:hover { text-decoration: underline; }
        .result-item { margin-bottom: 25px; }
        .result-url { font-size: 13px; color: #202124; margin-bottom: 4px; word-break: break-all; }
        .result-title { font-size: 18px; color: #1a0dab; text-decoration: none; display: block; margin-bottom: 4px; line-height: 1.3; font-weight: 500; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 14px; color: #4d5156; line-height: 1.5; }
        .loading, .no-results { font-size: 16px; color: #5f6368; margin-top: 20px; text-align: center; line-height: 1.6; }
        .fallback-btn { margin-top: 15px; padding: 10px 24px; background: #003366; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-right: 8px; }
        .fallback-btn:hover { background: #002244; }
        .fallback-btn.alt { background: #fff; color: #003366; border: 1px solid #003366; }
        .fallback-btn.alt:hover { background: #f1f3f4; }
        .search-info { font-size: 13px; color: #5f6368; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e0e0e0; }
        .source-badge { display: inline-block; background: #e8f0fe; color: #003366; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-weight: 600; }
        
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #003366; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
