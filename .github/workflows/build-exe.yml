name: Build Windows EXE with Icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        shell: pwsh
        run: |
          npm init -y
          npm install electron electron-builder --save-dev
          npm install png-to-ico --save-dev

      - name: Create main.js
        shell: pwsh
        run: |
          $mainJs = @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              icon: path.join(__dirname, 'build', 'icon.ico'),
              webPreferences: {
                nodeIntegration: true,
                contextIsolation: false
              }
            });
            win.loadFile(path.join(__dirname, 'www', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          "@
          Set-Content -Path main.js -Value $mainJs -Encoding UTF8
          Get-Content main.js

      - name: Copy Web Files to www
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path www | Out-Null
          robocopy . .\www /E `
            /XD www dist node_modules .git .github app build `
            /XF package.json package-lock.json main.js icon.png
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Generate ICO from PNG
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (Test-Path "icon.png") {
            node -e "const pngToIco=require('png-to-ico');pngToIco('icon.png').then(buf=>require('fs').writeFileSync('build/icon.ico',buf)).catch(e=>{console.error(e);process.exit(1)})"
          } else {
            Write-Host "icon.png not found, skipping icon"
          }
        continue-on-error: true

      - name: Update package.json
        shell: pwsh
        run: |
          $pkgJson = @"
          {
            "name": "avelia",
            "version": "1.0.0",
            "description": "Avelia Desktop App",
            "main": "main.js",
            "author": "Avelia",
            "scripts": {
              "build": "electron-builder --win"
            },
            "build": {
              "appId": "com.avelia.avelia",
              "productName": "Avelia",
              "files": [
                "main.js",
                "www/**/*",
                "build/icon.ico"
              ],
              "win": {
                "target": "nsis",
                "icon": "build/icon.ico"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "Avelia"
              }
            }
          }
          "@
          Set-Content -Path package.json -Value $pkgJson -Encoding UTF8
          Get-Content package.json

      - name: Debug - Show files
        shell: pwsh
        run: |
          Write-Host "=== Root ==="
          Get-ChildItem -Force | Select-Object Name
          Write-Host "=== www ==="
          if (Test-Path www) { Get-ChildItem www -Recurse | Select-Object FullName }
          Write-Host "=== build ==="
          if (Test-Path build) { Get-ChildItem build }

      - name: Build EXE
        run: npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Avelia-Windows-EXE
          path: |
            dist/*.exe
