name: Build Windows EXE with Icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        shell: pwsh
        run: |
          npm init -y
          npm install electron electron-builder --save-dev
          npm install png-to-ico --save-dev

      - name: Copy Web Files to www
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path www | Out-Null
          Get-ChildItem -Path . -Exclude @('app','.git','.github','node_modules','dist','package.json','package-lock.json','main.js','icon.png') | Copy-Item -Destination .\www -Recurse -Force

      - name: Generate ICO from PNG
        shell: pwsh
        run: |
          if (Test-Path "icon.png") {
            node -e "const pngToIco=require('png-to-ico');pngToIco('icon.png').then(buf=>require('fs').writeFileSync('build/icon.ico',buf))" 
          } else {
            Write-Host "icon.png not found, skipping icon"
          }
        continue-on-error: true

      - name: Prepare build folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (Test-Path "icon.png") {
            node -e "const pngToIco=require('png-to-ico');pngToIco('icon.png').then(buf=>require('fs').writeFileSync('build/icon.ico',buf))"
          }

      - name: Create main.js
        shell: pwsh
        run: |
          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              icon: path.join(__dirname, 'build', 'icon.ico'),
              webPreferences: {
                nodeIntegration: true,
                contextIsolation: false
              }
            });
            win.loadFile(path.join(__dirname, 'www', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Out-File -FilePath main.js -Encoding utf8

      - name: Update package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.main = "main.js"
          $pkg.scripts = @{ build = "electron-builder --win" }
          $pkg.author = "Avelia"
          $pkg.description = "Avelia Desktop App"
          $pkg.build = @{
            appId = "com.avelia.avelia"
            productName = "Avelia"
            win = @{
              target = "nsis"
              icon = "build/icon.ico"
            }
            nsis = @{
              oneClick = $false
              allowToChangeInstallationDirectory = $true
              createDesktopShortcut = $true
              createStartMenuShortcut = $true
              shortcutName = "Avelia"
            }
          }
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Build EXE
        run: npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Avelia-Windows-EXE
          path: |
            dist/*.exe
