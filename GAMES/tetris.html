<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile-Friendly Tetris with Rotate</title>
<style>
    body {
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        color: white;
        flex-direction: column;
        user-select: none;
        touch-action: manipulation;
    }

    #playerInfo {
        margin-bottom: 10px;
        font-size: 18px;
        display: flex;
        gap: 20px;
        align-items: center;
    }

    #playerInfo input {
        padding: 5px 10px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #555;
        background: #222;
        color: white;
    }

    #playerNameDisplay {
        margin-bottom: 5px;
        font-size: 20px;
        color: #0dc2ff;
    }

    #tetris {
        border: 3px solid #444;
        background: #000;
        position: relative;
    }

    #scoreBox {
        margin-bottom: 10px;
        font-size: 24px;
    }

    #controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
    }

    button {
        padding: 10px 20px;
        background: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 5px;
        font-size: 16px;
    }

    button:hover {
        background: #555;
        cursor: pointer;
    }

    #gameOverOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        color: red;
        font-size: 32px;
        font-weight: bold;
        z-index: 2;
        flex-direction: column;
        display: none;
    }

    #gameOverOverlay button {
        margin-top: 15px;
        font-size: 20px;
    }
</style>
</head>
<body>

<div id="playerInfo">
    Player: <input type="text" id="playerName" placeholder="Enter your name" />
    <span id="creatorName">Creator: MUHAMMAD TAQI</span>
</div>
<div id="playerNameDisplay"></div>
<div id="scoreBox">Score: <span id="score">0</span></div>

<div style="position: relative;">
    <canvas id="tetris" width="240" height="400"></canvas>
    <div id="gameOverOverlay">
        Game Over
        <button id="restartBtn">Restart</button>
    </div>
</div>

<div id="controls">
    <button id="leftBtn">◀ Left</button>
    <button id="rightBtn">Right ▶</button>
    <button id="dropBtn">⬇ Drop</button>
    <button id="rotateBtn">⬆ Rotate</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="resumeBtn">▶ Resume</button>
    <button id="downloadBtn">💾 Download Game</button>
</div>

<script>
const canvas = document.getElementById("tetris");
const ctx = canvas.getContext("2d");
ctx.scale(20, 20);

let dropCounter = 0;
let dropInterval = 500;
let lastTime = 0;
let paused = false;
let gameOver = false;
let moveInterval;

/* ------------ Tetris Core Functions ------------ */
function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
    }
}

function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 &&
                (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

function createMatrix(w, h) {
    const matrix = [];
    while (h--) matrix.push(new Array(w).fill(0));
    return matrix;
}

function createPiece(type) {
    const pieces = {
        T: [[0,0,0],[1,1,1],[0,1,0]],
        O: [[2,2],[2,2]],
        L: [[0,3,0],[0,3,0],[0,3,3]],
        J: [[0,4,0],[0,4,0],[4,4,0]],
        I: [[0,5,0,0],[0,5,0,0],[0,5,0,0],[0,5,0,0]],
        S: [[0,6,6],[6,6,0],[0,0,0]],
        Z: [[7,7,0],[0,7,7],[0,0,0]],
    };
    return pieces[type];
}

function drawMatrix(matrix, offset) {
    matrix.forEach((row, y) =>
        row.forEach((value, x) => {
            if (value !== 0) {
                ctx.fillStyle = colors[value];
                ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            }
        })
    );
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
        });
    });
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) matrix.forEach(row => row.reverse());
    else matrix.reverse();
}

function playerDrop() {
    if (paused || gameOver) return;
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
    }
    dropCounter = 0;
}

function playerMove(dir) {
    if (paused || gameOver) return;
    player.pos.x += dir;
    if (collide(arena, player)) player.pos.x -= dir;
}

function playerReset() {
    const pieces = "TJLOSZI";
    player.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    if (collide(arena, player)) {
        gameOver = true;
        document.getElementById("gameOverOverlay").style.display = "flex";
    }
}

function playerRotate(dir) {
    if (paused || gameOver) return;
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
}

/* ------------ Rendering Loop ------------ */
function update(time = 0) {
    if (!paused && !gameOver) {
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
        draw();
    }
    requestAnimationFrame(update);
}

function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawMatrix(arena, { x: 0, y: 0 });
    drawMatrix(player.matrix, player.pos);
}

function updateScore() {
    const playerName = document.getElementById("playerName").value || "Player";
    document.getElementById("score").innerText = player.score;
    document.getElementById("playerNameDisplay").innerText = `Player: ${playerName}`;
}

/* ------------ Keyboard Controls ------------ */
document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") playerMove(-1);
    if (event.key === "ArrowRight") playerMove(1);
    if (event.key === "ArrowDown") playerDrop();
    if (event.key === "ArrowUp") playerRotate(1);
});

/* ------------ Button & Touch Controls ------------ */
function startMove(dir) {
    playerMove(dir);
    moveInterval = setInterval(() => playerMove(dir), 150);
}

function stopMove() {
    clearInterval(moveInterval);
}

const leftBtn = document.getElementById("leftBtn");
leftBtn.addEventListener("mousedown", () => startMove(-1));
leftBtn.addEventListener("mouseup", stopMove);
leftBtn.addEventListener("mouseleave", stopMove);
leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startMove(-1); });
leftBtn.addEventListener("touchend", stopMove);

const rightBtn = document.getElementById("rightBtn");
rightBtn.addEventListener("mousedown", () => startMove(1));
rightBtn.addEventListener("mouseup", stopMove);
rightBtn.addEventListener("mouseleave", stopMove);
rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startMove(1); });
rightBtn.addEventListener("touchend", stopMove);

const dropBtn = document.getElementById("dropBtn");
dropBtn.addEventListener("mousedown", playerDrop);
dropBtn.addEventListener("touchstart", (e) => { e.preventDefault(); playerDrop(); });

const rotateBtn = document.getElementById("rotateBtn");
rotateBtn.addEventListener("click", () => playerRotate(1));
rotateBtn.addEventListener("touchstart", (e) => { e.preventDefault(); playerRotate(1); });

const pauseBtn = document.getElementById("pauseBtn");
pauseBtn.addEventListener("click", () => paused = true);
pauseBtn.addEventListener("touchstart", (e) => { e.preventDefault(); paused = true; });

const resumeBtn = document.getElementById("resumeBtn");
resumeBtn.addEventListener("click", () => paused = false);
resumeBtn.addEventListener("touchstart", (e) => { e.preventDefault(); paused = false; });

const restartBtn = document.getElementById("restartBtn");
restartBtn.addEventListener("click", () => {
    arena.forEach(row => row.fill(0));
    player.score = 0;
    updateScore();
    gameOver = false;
    paused = false;
    document.getElementById("gameOverOverlay").style.display = "none";
    playerReset();
});

/* ------------ Download Game Button ------------ */
const downloadBtn = document.getElementById("downloadBtn");
downloadBtn.addEventListener("click", () => {
    const htmlContent = `<!DOCTYPE html>\n${document.documentElement.outerHTML}`;
    const blob = new Blob([htmlContent], { type: "text/html" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "tetris_game.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});

/* ------------ Game Initialization ------------ */
const colors = [
    null,
    "#FF0D72","#0DC2FF","#0DFF72","#F538FF",
    "#FF8E0D","#FFE138","#3877FF",
];

const arena = createMatrix(12, 20);
const player = { pos: { x: 0, y: 0 }, matrix: null, score: 0 };

playerReset();
update();
updateScore();
</script>

</body>
</html>
